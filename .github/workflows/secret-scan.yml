name: Secret Scan

# Scans the full git history for committed secrets on every push and PR.
# This is the authoritative guard; the local lefthook (lefthook.yml) runs the
# same gitleaks scan pre-commit/pre-push when the binary is installed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git /github/workspace --config /github/workspace/.gitleaks.toml --redact --no-banner --verbose
